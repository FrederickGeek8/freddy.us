---
layout: blog.default
backlink: "/blog"
---

<div id="navigation">
  <div id="title">
    <a href="{{ page.backlink | default: '/' }}">Frederick's Ramblings</a>
  </div>
</div>
<div class="container tight">
  <div class="spacer">
    <b>Abstract:</b>
    <p>Posts marked with the "{{ page.tag }}" tag.</p>
  </div>
  <h1>Post by Tag: "{{ page.tag }}"</h1>

  <ul>
    {% for post in site.tags[page.tag] %}
    <li>
      {{ post.date | date: "%B %d, %Y" }}:
      <a href="{{ post.url }}">{{ post.title }}</a>
    </li>
    {% endfor %}
  </ul>
</div>
