---
layout: blog.default
---

<div id="navigation">
  <div id="title">
    <a href="{{ page.backlink | default: '/blog' }}" rel="prev">
      Frederick's Ramblings
    </a>
  </div>
</div>
<div class="container tight">
  <div class="spacer">
    <b>Abstract:</b>
    <p>{{ page.description }}</p>
  </div>

  <div class="postcontent">{{ content }}</div>
</div>
<div id="footer" class="tight" style="text-align: center">
  <p id="copyright">
    &copy; {{ site.time | date: '%Y' }} Frederick Morlock. All rights reserved.
  </p>
</div>
